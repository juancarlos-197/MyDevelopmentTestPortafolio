<ion-header [translucent]="true">
  <ion-toolbar color="success" >
    <ion-title class="title" >Registrar App Portafolio 🐵</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">registarse </ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-item>
    <ion-label position="floating">Correo intitucional</ion-label>
    <ion-input type="email"[(ngModel)]="user.email" required></ion-input>
  </ion-item>
  <ion-item>
    <ion-label position="floating">Contraseña</ion-label>
    <ion-input type="password"[(ngModel)]="user.password" required></ion-input>
  </ion-item>

  <ion-button class="ion-padding"  class="buton-negro"color="primary" (click)="registro(user)" >Registrarse</ion-button>

</ion-content>
